<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D2A2F">
<title>Pemindai Absensi - SMA Negeri 4 Siak Hulu</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#F2F5F5;color:#13242A}
  .page{min-height:100vh;padding:14px}
  .wrap{max-width:520px;margin:0 auto}
  .header{background:linear-gradient(135deg,#0D2A2F,#12776B);color:#fff;border-radius:16px;padding:18px;text-align:center;border-bottom:4px solid #C8962E;margin-bottom:14px}
  .header h1{margin:0;font-size:20px}
  .header p{margin:6px 0 0;font-size:13.5px;opacity:.9}
  .card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.07);margin-bottom:14px}
  #reader{width:100%;max-width:450px;margin:0 auto;overflow:hidden;border-radius:12px;background:#0b1a1d;min-height:60px}
  .status{margin-top:12px;padding:12px;border-radius:10px;background:#EEF2F2;color:#475569;text-align:center;font-size:14px;line-height:1.5}
  .status.proses{background:#FEF3C7;color:#92400E}
  .status.sukses{background:#DCFCE7;color:#166534}
  .status.gagal{background:#FEE2E2;color:#991B1B}
  .hasil{display:none;margin-top:12px;padding:14px;border-radius:12px;line-height:1.7;font-size:15px}
  .hasil.sukses{display:block;background:#DCFCE7;color:#166534;border:1px solid #86EFAC}
  .hasil.terlambat{display:block;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D}
  .hasil.gagal{display:block;background:#FEE2E2;color:#991B1B;border:1px solid #FCA5A5}
  .hasil .nama{font-size:19px;font-weight:800}
  .who{font-size:13px;color:#667781;text-align:center;margin-bottom:10px}
  .btn{width:100%;border:0;border-radius:10px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}
  .btn-hijau{background:#12776B;color:#fff}
  .btn-abu{background:#E3E9EA;color:#13242A}
  .fi{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:14px;font-weight:600}
  .fi input{border:1px solid #C9D2CA;border-radius:9px;padding:11px 12px;font:inherit;font-weight:400}
  #loginBox{display:none}
  .foot{text-align:center;color:#94A3B8;font-size:12px;padding:6px 0 18px}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div class="page"><div class="wrap">

  <div class="header">
    <h1>SMA Negeri 4 Siak Hulu</h1>
    <p>Pemindai Absensi Siswa</p>
  </div>

  <div class="card" id="scanBox">
    <div class="who" id="who"></div>
    <div id="reader"></div>
    <div id="status" class="status proses">Menyiapkan pemindai...</div>
    <div id="hasil" class="hasil"></div>
    <button id="btnUlang" class="btn btn-hijau" style="display:none" type="button">Buka kamera lagi</button>
    <button id="btnTutup" class="btn btn-abu" type="button">Tutup pemindai</button>
  </div>

  <!-- Login hanya muncul bila halaman dibuka tanpa sesi dari aplikasi -->
  <div class="card" id="loginBox">
    <b>Masuk</b>
    <p style="font-size:13.5px;color:#667781;margin:4px 0 12px">Sebaiknya buka pemindai dari menu Absensi QR di aplikasi agar tidak perlu masuk lagi.</p>
    <div id="loginErr" class="status gagal" style="display:none;margin:0 0 12px"></div>
    <form id="loginForm">
      <label class="fi">Username<input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="fi">Kata sandi<input id="lp" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-hijau" id="lBtn" type="submit">Masuk dan buka kamera</button>
    </form>
  </div>

  <div class="foot">Sistem Informasi Absensi Siswa<br>SMA Negeri 4 Siak Hulu</div>
</div></div>

<script>
/* ============================================================
   KONFIGURASI
   Alamat Web App biasanya dikirim otomatis oleh aplikasi lewat link.
   Isi alamat di bawah hanya sebagai cadangan (alamat deployment /exec Anda).
   ============================================================ */
var API_CADANGAN = '';

var JEDA_MS = 2200;   // jeda setelah tiap hasil sebelum QR berikutnya diterima
var RE_API = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;

var TOKEN = '', API_URL = '', USER = null;
var qr = null, jalan = false, sibuk = false;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function setStatus(h, k){ var e = $('status'); e.className = 'status ' + (k || ''); e.innerHTML = h; }
function setHasil(h, k){ var e = $('hasil'); e.className = 'hasil ' + (k || ''); e.innerHTML = h || ''; e.style.display = h ? 'block' : 'none'; }
function store(k, v){ try{ if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); }catch(e){} return ''; }

/* ---------- Panggilan ke server (doPost di Scan.gs) ---------- */
function panggil(fn, args){
  if (!API_URL) return Promise.reject(new Error('Alamat Web App belum diketahui. Buka pemindai dari menu Absensi QR di aplikasi.'));
  // Tanpa header khusus agar menjadi "simple request" dan tidak diblokir CORS preflight
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow' })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan.'); return j.data; });
}

/* ---------- Awal: ambil sesi dari link aplikasi ---------- */
function bacaLink(){
  var h = new URLSearchParams(location.hash.replace(/^#/, ''));
  var t = h.get('t') || '', a = h.get('api') || '';
  if (t) store('asd_t', t);
  if (a && RE_API.test(a)) store('asd_api', a);
  // Hapus token dari alamat agar tidak ikut tersalin atau tersimpan di riwayat
  if (location.hash) { try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){} }
  TOKEN = t || store('asd_t') || '';
  var api = (a && RE_API.test(a)) ? a : (store('asd_api') || '');
  API_URL = api || API_CADANGAN;
}

function tampilLogin(pesan){
  hentikan();
  $('scanBox').style.display = 'none';
  $('loginBox').style.display = 'block';
  var e = $('loginErr');
  if (pesan){ e.textContent = pesan; e.style.display = 'block'; } else e.style.display = 'none';
  $('lu').focus();
}
function tampilScan(){
  $('loginBox').style.display = 'none';
  $('scanBox').style.display = 'block';
}

function mulai(){
  bacaLink();
  if (!API_URL){ tampilScan(); setStatus('❌ Alamat Web App belum diketahui.<br>Buka pemindai dari menu <b>Absensi QR</b> di aplikasi.', 'gagal'); return; }
  if (!TOKEN){ tampilLogin(''); return; }
  setStatus('Memeriksa sesi...', 'proses');
  panggil('getSession', [TOKEN]).then(function(info){
    USER = info;
    if ((info.pages || []).indexOf('scan') < 0){ tampilLogin('Akun ini tidak memiliki akses untuk memindai.'); return; }
    siap();
  }).catch(function(e){
    var m = String(e.message || e);
    if (m.indexOf('SESI_HABIS') > -1){ store('asd_t', null); TOKEN = ''; tampilLogin('Sesi berakhir. Silakan masuk lagi.'); return; }
    tampilScan(); setStatus('❌ ' + esc(m), 'gagal'); $('btnUlang').style.display = 'block';
  });
}

function siap(){
  tampilScan();
  $('who').textContent = 'Petugas: ' + (USER ? USER.nama + ' (' + USER.role + ')' : '');
  setTimeout(kamera, 250);
}

/* ---------- Login cadangan ---------- */
$('loginForm').onsubmit = function(ev){
  ev.preventDefault();
  var b = $('lBtn'); b.disabled = true; b.textContent = 'Memproses...'; $('loginErr').style.display = 'none';
  panggil('login', [$('lu').value, $('lp').value]).then(function(r){
    b.disabled = false; b.textContent = 'Masuk dan buka kamera';
    TOKEN = r.token; store('asd_t', TOKEN); USER = r.user; $('lp').value = '';
    if ((USER.pages || []).indexOf('scan') < 0){ tampilLogin('Akun ini tidak memiliki akses untuk memindai.'); return; }
    siap();
  }).catch(function(e){
    b.disabled = false; b.textContent = 'Masuk dan buka kamera';
    var el = $('loginErr'); el.textContent = e.message || String(e); el.style.display = 'block';
  });
};

/* ---------- Kamera ---------- */
function kamera(){
  if (jalan) return;
  if (typeof Html5Qrcode === 'undefined'){ setStatus('❌ Pustaka pemindai gagal dimuat. Periksa koneksi internet lalu muat ulang.', 'gagal'); $('btnUlang').style.display = 'block'; return; }
  $('btnUlang').style.display = 'none';
  setStatus('📷 Meminta akses kamera...<br>Jika diminta izin, pilih <b>Izinkan</b>.', 'proses');
  var cfg = { fps: 10, aspectRatio: 1.0, rememberLastUsedCamera: true,
    qrbox: function(w, h){ var s = Math.floor(Math.min(w, h) * 0.72); s = Math.min(320, Math.max(180, s)); return { width: s, height: s }; } };
  qr = new Html5Qrcode('reader');
  qr.start({ facingMode: 'environment' }, cfg, terbaca, function(){})
    .catch(function(){
      try{ qr.clear(); }catch(e){}
      qr = new Html5Qrcode('reader');
      return qr.start({ facingMode: 'user' }, cfg, terbaca, function(){});
    })
    .then(function(){ jalan = true; setStatus('🟢 Kamera aktif.<br>Arahkan ke QR pada kartu siswa.', ''); })
    .catch(function(e){
      jalan = false;
      var m = String((e && e.message) || e), k = m.toLowerCase();
      if (k.indexOf('permission') > -1 || k.indexOf('notallowed') > -1) m = 'Izin kamera ditolak. Izinkan kamera untuk halaman ini di pengaturan browser, lalu coba lagi.';
      setStatus('❌ Kamera tidak dapat dibuka.<br>' + esc(m), 'gagal');
      $('btnUlang').style.display = 'block';
    });
}
function hentikan(){
  var q = qr; qr = null;
  if (!q){ jalan = false; return Promise.resolve(); }
  return q.stop().catch(function(){}).then(function(){ try{ q.clear(); }catch(e){} jalan = false; });
}

/* ---------- Saat QR terbaca ---------- */
function terbaca(teks){
  if (sibuk) return;
  teks = String(teks || '').trim();
  if (!teks) return;
  sibuk = true;
  setStatus('⏳ QR terbaca. Mencatat absensi...', 'proses');
  panggil('scanQR', [TOKEN, teks]).then(tampilHasil).catch(function(e){
    var m = String(e.message || e);
    if (m.indexOf('SESI_HABIS') > -1){ store('asd_t', null); TOKEN = ''; sibuk = false; tampilLogin('Sesi berakhir. Silakan masuk lagi.'); return; }
    if (m.indexOf('GANTI_SANDI') > -1){ setStatus('❌ Kata sandi Anda masih sementara. Ganti dulu di aplikasi, lalu buka pemindai lagi.', 'gagal'); jedaLalu(); return; }
    if (m.indexOf('tidak memiliki akses') > -1){ setStatus('❌ Akun ini tidak memiliki akses untuk memindai.', 'gagal'); jedaLalu(); return; }
    // Gangguan jaringan: aman dicoba lagi karena server menolak absen ganda
    setStatus('❌ Koneksi bermasalah: ' + esc(m) + '<br>Scan QR yang sama lagi. Jika muncul "sudah tercatat", datanya sudah masuk.', 'gagal');
    jedaLalu();
  });
}
function jedaLalu(){ setTimeout(function(){ sibuk = false; }, JEDA_MS); }

function tampilHasil(r){
  var s = r.siswa || {};
  if (r.ok){
    var telat = String(r.status).toLowerCase() === 'terlambat';
    setStatus('✅ Absensi tercatat.', 'sukses');
    setHasil('<div class="nama">' + esc(s.nama) + '</div><div>Kelas: ' + esc(s.kelas) + '</div><div>NISN: ' + esc(s.nisn) + '</div><div>Status: <b>' + esc(r.status) + '</b> pukul ' + esc(r.jam) + '</div>', telat ? 'terlambat' : 'sukses');
    try{ navigator.vibrate && navigator.vibrate(120); }catch(e){}
  } else if (r.duplikat){
    setStatus('⚠️ Siswa sudah absen.', 'proses');
    setHasil('<b>SUDAH ABSEN</b><div class="nama">' + esc(s.nama) + '</div><div>Kelas: ' + esc(s.kelas) + '</div><div>' + esc(r.pesan) + '</div>', 'terlambat');
    try{ navigator.vibrate && navigator.vibrate([80, 60, 80]); }catch(e){}
  } else {
    setStatus('❌ Absensi ditolak.', 'gagal');
    setHasil('<b>TIDAK BERHASIL</b><div>' + esc(r.pesan || 'QR tidak dapat diproses.') + '</div>', 'gagal');
    try{ navigator.vibrate && navigator.vibrate([200]); }catch(e){}
  }
  jedaLalu();
}

$('btnUlang').onclick = function(){ hentikan().then(kamera); };
$('btnTutup').onclick = function(){
  hentikan();
  try{ if (history.length > 1){ history.back(); return; } }catch(e){}
  window.close();
};
window.addEventListener('beforeunload', function(){ try{ if (qr && jalan) qr.stop(); }catch(e){} });
window.addEventListener('load', mulai);
</script>
</body>
</html>
